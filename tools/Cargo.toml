[package]
name = "dxfeed-graal-tools"
description = "A collection of useful utilities that use the dxFeed API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "Tools"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
dxfeed-graal = { path = "../dxfeed-graal" }

[dev-dependencies]
regex = { version = "1.13", default-features = false, features = ["std"] }

[build-dependencies]
dxfeed-graal-build = { path = "../dxfeed-graal-build" }

[lints]
workspace = true
