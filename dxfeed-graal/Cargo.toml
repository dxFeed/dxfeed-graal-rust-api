[package]
name = "dxfeed-graal"
description = "Rust API for dxFeed over the Graal Native SDK"
# Lets build.rs forward the SDK location to dependents as DEP_DXFEED_GRAAL_LIB_DIR.
links = "dxfeed_graal"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The text of the license in the package.
license-file = "../LICENSE"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dxfeed-graal"
readme = "../README.md"
keywords = ["dxfeed", "market-data", "finance", "trading", "graal"]
categories = ["api-bindings", "finance"]
# What the build of a dependent needs; not the tests.
include = ["/src/**", "/build.rs"]

[dependencies]
dxfeed-graal-sys = { version = "0.1.0", path = "../dxfeed-graal-sys" }

[features]
# The experimental tier of the SDK: the feed filters, the ready signal of the event queues and the event peek of the
# time series transaction models. They may change in a minor release of the SDK.
experimental = []

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
