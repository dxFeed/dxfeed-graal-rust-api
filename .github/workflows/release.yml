name: Release

# A tag v<major>.<minor>.<patch>[-<suffix>] publishes a GitHub release with the Tools and Samples archives of every
# platform of the SDK and the notes of the version, then, once approved in the crates-io environment, the crates on
# crates.io (HOW_TO_RELEASE.md). Pull requests that touch the release path, and a manual run, build and check the same
# archives without publishing.
on:
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - xtask/**
      - tools/**
      - samples/**
      - dxfeed-graal-build/**
      - dxfeed-graal-sys/build.rs
      - dxfeed-graal-sys/Cargo.toml
      - ReleaseNotes.md
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain of the gates and of build.yml.
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  # The tag and its notes, checked before anything is built: a tag must match the workspace version and have a section
  # in ReleaseNotes.md. Without a tag (a pull request, a manual run) the tag is that of the workspace version.
  notes:
    name: Release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="$(cargo run -q --locked -p xtask -- release-tag)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag"

      - name: Notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cargo run -q --locked -p xtask -- release-notes "$TAG" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: Oracle Linux 8, as the C++ release, so the executables need glibc 2.28, not that of the runner.
          - name: linux-x64
            image: ubuntu-24.04
            container: oraclelinux:8
          - name: linux-aarch64
            image: ubuntu-24.04-arm
            container: oraclelinux:8
          - name: win-x64
            image: windows-2022
          - name: osx-aarch64
            image: macos-15
          - name: osx-x64
            image: macos-15-intel
    runs-on: ${{ matrix.image }}
    # Empty for Windows and macOS: the job runs on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      # Before the checkout: git for it, gcc as the linker, tar and gzip for the caches and the archives, and zlib,
      # which the SDK library needs.
      - name: Install the build tools
        if: matrix.container != ''
        run: dnf -y install gcc git tar gzip zlib

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build
        run: cargo build --locked --release -p dxfeed-graal-tools -p dxfeed-graal-samples

      # Writes the Tools and Samples archives to dist/ and runs Tools and a sample from the unpacked archives.
      - name: Package
        env:
          TAG: ${{ needs.notes.outputs.tag }}
        run: cargo run --locked -p xtask -- package "$TAG" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [ notes, package ]
    # Only a pushed tag publishes; a manual run on a tag only builds.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          count="$(ls *.zip *.tar.gz | wc -l)"
          if [ "$count" -ne 10 ]; then
            echo "expected 10 archives, found $count" >&2
            exit 1
          fi
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A tag with a suffix (-rc.1) is a prerelease, one with "draft" a draft that is published by hand; only a plain
      # vX.Y.Z becomes the latest release.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.notes.outputs.tag }}
          name: ${{ needs.notes.outputs.tag }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          draft: ${{ contains(needs.notes.outputs.tag, 'draft') }}
          prerelease: ${{ contains(needs.notes.outputs.tag, '-') }}
          make_latest: ${{ !contains(needs.notes.outputs.tag, '-') }}

  # The crates of the API on crates.io, after the GitHub release. The crates-io environment holds the token
  # (CARGO_REGISTRY_TOKEN), lets only v* tags in and waits for the approval of its reviewer. A published version is
  # final, so a draft tag publishes nothing; a version already on crates.io is skipped, so a failed run can be re-run.
  crates:
    name: crates.io
    needs: [ notes, publish ]
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(needs.notes.outputs.tag, 'draft')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # One by one in the order of their dependencies; each is built from its package before it is uploaded.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in dxfeed-graal-sys dxfeed-graal-build dxfeed-graal; do
            if output="$(cargo publish --locked -p "$crate" 2>&1)"; then
              echo "$output"
            elif grep -qE 'already (exists|uploaded)' <<< "$output"; then
              echo "$crate: this version is already on crates.io"
            else
              echo "$output"
              exit 1
            fi
          done
