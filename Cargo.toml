[workspace]
resolver = "3"
members = ["dxfeed-graal-sys", "dxfeed-graal", "dxfeed-graal-build", "samples", "tools", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["Devexperts LLC"]
repository = "https://github.com/dxFeed/dxfeed-graal-rust-api"
homepage = "https://github.com/dxFeed/dxfeed-graal-rust-api"
# The tools, the samples and xtask; the crates of the API override it.
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
