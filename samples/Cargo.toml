[package]
name = "dxfeed-graal-samples"
description = "The samples of the dxFeed Graal Rust API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autobins = false

[dependencies]
dxfeed-graal = { path = "../dxfeed-graal" }

[build-dependencies]
dxfeed-graal-build = { path = "../dxfeed-graal-build" }

[lints]
workspace = true

# The samples have the names and groups of the samples of the C++ API; run a sample from its directory, which holds
# its dxfeed.system.properties.

[[bin]]
name = "AuthSample"
path = "API/AuthSample/main.rs"
test = false

