[package]
name = "dxfeed-graal-build"
description = "Build-script helper that deploys the dxFeed Graal Native SDK library next to an application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dxfeed-graal-build"
readme = "README.md"
keywords = ["dxfeed", "build", "deploy", "graal"]
categories = ["development-tools::build-utils"]
# What the build of a dependent needs; not the tests.
include = ["/src/**", "/README.md"]

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lints]
workspace = true
