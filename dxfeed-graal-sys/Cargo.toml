[package]
name = "dxfeed-graal-sys"
version = "0.2.1+sdk.3.15.0"
description = "Raw FFI bindings to the dxFeed Graal Native SDK C API (dxfg_v4_)"
links = "DxFeedGraalNativeSdk"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dxfeed-graal-sys"
readme = "README.md"
keywords = ["dxfeed", "market-data", "finance", "ffi", "graal"]
categories = ["external-ffi-bindings", "finance"]
# What the build of a dependent needs; not the tests.
include = ["/src/**", "/build.rs", "/build/**", "/tests/**", "/README.md"]

[features]
default = ["download"]
# Downloads the SDK archive from the GitHub release when DXFEED_GRAAL_SDK_DIR is not set.
download = ["dep:ureq", "dep:zip"]

[build-dependencies]
sha2 = "0.11.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lints]
workspace = true
