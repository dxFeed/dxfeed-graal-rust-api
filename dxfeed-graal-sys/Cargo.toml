[package]
name = "dxfeed-graal-sys"
version = "0.1.0+sdk.3.12.0"
description = "Raw FFI bindings to the dxFeed Graal Native SDK C API (dxfg_v4_)"
links = "DxFeedGraalNativeSdk"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["download"]
# Downloads the SDK archive from the GitHub release when DXFEED_GRAAL_SDK_DIR is not set.
download = ["dep:ureq", "dep:zip"]

[build-dependencies]
sha2 = "0.11.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[lints]
workspace = true
